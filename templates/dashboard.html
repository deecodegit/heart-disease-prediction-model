<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>model dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <div class="container">
        <h1>📊 model metrics dashboard</h1>

        <table class="metrics">
            {% for key, value in metrics.items() %}
            <tr>
                <td>{{ key }}</td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </table>

        <a href="/" class="btn">back</a>
    </div>
</body>

</html>
